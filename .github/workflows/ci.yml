name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enforce ADR-007 (engine imports nothing from apps/)
        run: |
          if grep -RE "from ['\"](\.\./)+apps/" packages/engine/src; then
            echo "::error::packages/engine/src imports from apps/ — ADR-007 violation"
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm -r run test
